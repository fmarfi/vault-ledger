[project]
name = "vault-ledger"
version = "0.1.0"
description = "Invoice-in -> journal-entry-out MVP"
requires-python = ">=3.9"
dependencies = [
    "pillow",
    "pytesseract",
    "scikit-learn",
    "scipy",
    "pandas",
    "flask",
    "pypdfium2",
]

[project.optional-dependencies]
dev = ["pytest", "fpdf2"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
