# Generative spec for Vault Ledger synthetic transactions (stage 1).
# Tags: every leaf parameter group has tag: sourced|assumption. Sourced items carry
# a url (domain-level, as recorded in spec/research_nl_expenses.md; not full-page reads).
# Synthetic-only: never quote accuracy on this data as real-world accuracy.
meta:
  version: 1
  market: NL
  languages: {en: 0.45, nl: 0.55, tag: assumption}
  currency: EUR
  vat_default_rate: 0.21
  target_rows: 4000
  tag: assumption
  label_space_note: >
    Only the 7 default active expense accounts (coa.EXPENSE_ACCOUNTS; data/accounts.json
    may customize, generator must not). Mechanical accounts Cash/Bank and Accounts
    Payable are never labels. Output columns match labeled_transactions.csv
    (vendor,description,account); metadata (archetype, difficulty, noise_applied,
    escalate, split) go in a separate file, never a model feature.
  sources:
    google_workspace: https://medhacloud.com
    m365: https://m365.de
    accountant_fees: https://qonto.com
    kvk_fee: https://zzp-kompas.nl
    belastingdienst_invoice_fields: https://www.belastingdienst.nl
    btw_deadlines: https://www.kvk.nl
    bol_marketplace: https://www.bol.com

seed: {default: 1337, run_seeds: [1337, 2024, 7], tag: assumption}

# Class prior over final labels (row count fraction). Must sum to 1.
# No authoritative NL split exists; all assumption (freelancer/ZZP mix).
class_prior:
  tag: assumption
  values:
    "Software & Subscriptions Expense": 0.27
    "Travel & Transport Expense": 0.22
    "Office Supplies Expense": 0.14
    "Utilities Expense": 0.11
    "General/Other Expense": 0.11
    "Professional Services Expense": 0.09
    "Rent Expense": 0.06

# Amounts in EUR ex-VAT unless noted. Sample, round to cents.
# REVISION 1 NOTE: per-vendor price points now live in the corpus archetypes (spec/corpus/*.json:
# `archetypes.<a>.plans|amt|rates|usage`), so a description, its amount and its vendor come from
# one archetype. The class-level families below remain the documented target shapes (and the
# Software seats/annual parameters are read by the generator). Amounts in a row are the document
# TOTAL (net + BTW, or net when reverse-charged/0%).
# credit_notes decision (revision 1): utility credit notes are NOT generated. The downstream
# entry rules reject amount <= 0 (rules R3, entry_rules.construct_entry), so a negative amount
# cannot enter the pipeline. The ~5% negative share implied by the old settlement component is
# removed from the spec rather than emitted as unusable rows. Tag: assumption.
amounts:
  "Software & Subscriptions Expense":
    family: mixture_point_masses_times_seats
    params:
      masses: [[6.90, 0.12], [13.80, 0.10], [10.93, 0.08], [9.99, 0.10], [19.99, 0.12], [29.00, 0.10], [49.00, 0.10], [99.00, 0.10], [199.00, 0.06], [12.00, 0.12]]
      seats: {1: 0.65, 2: 0.15, 3: 0.10, 5: 0.06, 10: 0.04}
      annual_multiplier: {p: 0.15, factor: 12, discount: 0.85}
    reason: SaaS is priced in tiers times seats; annual plans are rarer.
    # revision 1: realised prices come from per-vendor plan menus in the corpus archetypes (net price x seats,
    # x12 x0.85 on annual plans, usage-billed cloud/API vendors log-normal per vendor). The old spec's implied
    # q95 (~612, from 199-tier x 10 seats x annual) is not what real vendor menus produce: most vendors have
    # 1-2 plans below 100/month and only some per-seat plans. Spec target now: median 10-30, q95 100-300
    # (reason: per-vendor price points; the audited 199 -> ~140 is inside this range).
    expected_q95_range: [100, 300]
    tag: "sourced (Google 6.90/13.80, M365 ~10.93 unverified ex-VAT); other tiers assumption"
    url: [https://medhacloud.com, https://m365.de]
  "Travel & Transport Expense":
    family: mixture_lognormal
    components:
      - {name: ns_ov_tap, weight: 0.40, mu: 2.30, sigma: 0.70, clip: [2, 40]}      # median ~10
      - {name: fuel, weight: 0.20, mu: 4.10, sigma: 0.30, clip: [30, 110]}         # median ~60
      - {name: parking, weight: 0.20, mu: 1.90, sigma: 0.70, clip: [2, 25]}
      - {name: taxi_ride_share, weight: 0.10, mu: 3.00, sigma: 0.60, clip: [8, 80]}
      - {name: ov_subscription_or_flight, weight: 0.10, mu: 5.20, sigma: 0.60, clip: [100, 900]}
    reason: Heavy right tail from subscriptions/flights over many small fares.
    tag: assumption
  "Office Supplies Expense":
    family: lognormal
    params: {mu: 3.40, sigma: 1.00, clip: [2, 900]}   # median ~30, tail 500+
    reason: Discretionary purchases, right-skewed.
    tag: assumption
  "Utilities Expense":
    family: mixture
    components:
      - {name: energy, weight: 0.40, family: lognormal, mu: 4.60, sigma: 0.40, clip: [40, 320], seasonal_uplift: {oct_mar: 1.30, apr_sep: 0.85}}
      - {name: telecom, weight: 0.40, family: fixed_tiers, values: [12.50, 20.00, 29.00, 39.00, 55.00, 79.00], jitter_sd: 0.0}
      - {name: water, weight: 0.10, family: lognormal, mu: 3.40, sigma: 0.30, clip: [15, 80]}
      - {name: energy_annual_settlement, weight: 0.10, family: abs_normal, mu: 0.0, sd: 180, note: "revision 1: additional-payment settlements only; credit notes (negative amounts) dropped, see credit_notes decision below"}
    reason: Energy 60-250/mo with winter uplift; telecom near-fixed; annual settlement may be a credit.
    tag: assumption
  "Professional Services Expense":
    family: mixture
    components:
      - {name: accountant, weight: 0.35, family: lognormal, mu: 5.90, sigma: 0.50, clip: [150, 2500], note: 600-2500/yr split into installments, round_to: 5}
      - {name: consultant_legal, weight: 0.45, family: lognormal, mu: 6.40, sigma: 1.00, clip: [200, 5000], round_to: 50, round_prob: 0.6}
      - {name: notaris, weight: 0.12, family: lognormal, mu: 6.60, sigma: 0.70, clip: [300, 1500]}
      - {name: kvk_registration, weight: 0.08, family: constant, value: 85.15}
    tag: "sourced (accountant 600-2500/yr; KvK 85.15); shapes assumption"
    url: [https://qonto.com, https://zzp-kompas.nl]
  "Rent Expense":
    family: near_constant
    params:
      tiers: [{name: flexdesk, weight: 0.45, value_range: [150, 400]}, {name: office, weight: 0.55, value_range: [500, 1500]}]
      per_vendor_constant: true        # each vendor draws one base, then jitter
      jitter_sd_frac: 0.0              # rent identical month to month; indexation +2-4%/yr, 1 step at most
    tag: assumption
  "General/Other Expense":
    family: lognormal
    params: {mu: 3.20, sigma: 1.10, clip: [1, 700]}
    tag: assumption

vendor_frequency:
  # REVISION 1 SPEC DECISION (orchestrator): s=1.1 pure Zipf over ~50 vendors puts ~65% of mass in
  # the top 10, which contradicts the old 'top-10 < 40%' gate. The gate is now a HEURISTIC:
  # top-10 vendor share <= 55% of ANY class, measured over ALL rows of the class (hard/escalate
  # rows included; the clear-rows-only figure is reported but is not the gate).
  # Model: Zipf-Mandelbrot p(rank r) ~ (r + q)^-s with s = 1.0 exactly and offset q = 3.0 (a pure
  # Zipf s=1.0 over 48-63 vendors would still give 59-62% in the top 10). The manifest reports
  # the realised exponent by MLE (not OLS) for the generating family (q fixed) and for pure Zipf.
  family: zipf_mandelbrot
  exponent_s: 1.0
  offset_q: 3.0
  subtype_weights:      # rank order inside a subtype = corpus order; subtype weights are assumptions
    "Travel & Transport Expense": {ov: 0.40, fuel: 0.20, parking: 0.20, taxi: 0.10, ovsub: 0.10}
    "Utilities Expense": {energy: 0.50, telecom: 0.40, water: 0.10}
    "Professional Services Expense": {accountant: 0.35, consultant: 0.45, notaris: 0.12, kvk: 0.08}
  one_off_tail_fraction: 0.30   # informational: NOT forced any more; the realised singleton share is a by-product of the multinomial draw
  min_vendor_strings_per_class: 30
  top10_vendor_share_max: 0.55  # heuristic gate, all rows of a class
  general_other_max_single_vendor_share: 0.12   # heuristic cap on one hard-case brand inside General/Other
  tag: assumption

vendor_archetypes:   # public business names as archetypes only; corpus-builder expands
  tag: assumption   # NL vendor lists per research file (A)
  "Software & Subscriptions Expense": [Microsoft 365, Google Workspace, Adobe, Slack, Zoom, Dropbox, Notion, GitHub, Moneybird, Exact, AWS, Azure, Atlassian, Canva, generic_saas_bv]
  "Travel & Transport Expense": [NS, GVB, RET, HTM, "Shell (fuel)", "BP (fuel)", "Tango (fuel)", Q-Park, Parkmobile, EasyPark, Uber, Swapfiets, KLM, Transavia, taxi_local]
  "Office Supplies Expense": [Staples, Viking, Coolblue (stationery/hardware), Bol.com (stationery), Amazon.nl (stationery), Action (stationery), Office Centre, papierwaren_local, printer_inkt_shop]
  "Utilities Expense": [Eneco, Vattenfall, Essent, Greenchoice, Vitens, Dunea, Stedin, Liander, KPN, Odido, Vodafone, Ziggo]
  "Professional Services Expense": [accountantskantoor_generic, notariskantoor_generic, advocaten_generic, consultancy_bv_generic, KvK, boekhouder_zzp]
  "Rent Expense": [flexwerkplek_generic, kantoorverhuur_generic, vastgoed_bv_generic, coworking_generic]
  "General/Other Expense": [HEMA (misc), Albert Heijn (misc), Gamma, Praxis, kantine_local, bloemist_local, representatie_local]

recurrence:
  tag: assumption   # BTW deadlines themselves are sourced (kvk.nl) but not used as row generators
  rules:
    - {account: "Rent Expense", cadence: monthly, day_of_month: 1, vendor_persistence: 1.0, share_of_class_rows_recurring: 0.95}
    - {account: "Utilities Expense", sub: energy, cadence: monthly, day_of_month_choices: [1, 15, 25], annual_settlement_once_per_year_p: 0.10}
    - {account: "Utilities Expense", sub: telecom_water, cadence: monthly, day_of_month_choices: [3, 10, 20, 28]}
    - {account: "Software & Subscriptions Expense", cadence: monthly, share_of_class_rows_recurring: 0.75, day_of_month: fixed_per_vendor_uniform_1_28}
    - {account: "Software & Subscriptions Expense", cadence: annual, share_of_class_rows: 0.15, note: domains, licences}
    - {account: "Professional Services Expense", cadence: mixed, monthly_retainer_share: 0.15, quarterly_share: 0.15, one_off_share: 0.70, kvk_annual: true}
    - {account: "Travel & Transport Expense", cadence: irregular, ov_subscription_monthly_share: 0.05}
    - {account: "Office Supplies Expense", cadence: irregular}
    - {account: "General/Other Expense", cadence: irregular}
  date_range: {start: 2025-01-01, end: 2026-08-31, tag: assumption}
  recurring_vendor_note: >
    A recurring vendor's series must stay inside one split (vendor-disjoint).

paid_unpaid:
  tag: assumption   # feeds paid heuristic; verify against real documents
  # revision 1: bank lines and card/iDEAL receipts are paid by definition; only INVOICES can be unpaid.
  invoice_paid_fraction:
    "Software & Subscriptions Expense": 0.92
    "Travel & Transport Expense": 0.93
    "Office Supplies Expense": 0.88
    "Utilities Expense": 0.88
    "General/Other Expense": 0.90
    "Professional Services Expense": 0.50   # B2B invoices 40-60% unpaid at receipt
    "Rent Expense": 0.90
  payment_terms_days: {14: 0.30, 30: 0.70}
  # revision 2: charged to a card / account at the moment of use, so an invoice from these is a paid
  # receipt, never an open payable (realism review round 2: "Bolt ... unpaid").
  card_charged_archetypes: [ride_share, scooter_share, bike_share, car_share, ev_charging, parking, taxi,
                            taxi_local, fuel, fuel_local, city_transit, regional_transit, ov_tap, airline,
                            coach, ferry, rail_intl]
  overdue_tail_fraction_of_unpaid: 0.08   # not modelled in revision 1 (no dunning text)

payment_text:
  tag: "sourced (bank channels: belastingdienst.nl); shares assumption"
  # ONE payment field per row, chosen by document type. No stacking of channel + 'already paid'.
  # invoice: terms text only (unpaid -> due date / payable within; paid -> optional neutral terms)
  # bank line: SEPA channel; receipt_pos: card-terminal text; receipt_ideal: iDEAL.
  # Card-terminal text can only occur on archetypes whose doc mix contains receipt_pos (retail, fuel,
  # parking, taxi, restaurants...), never on professional services or rent.
  terms_days: {"14": 0.30, "30": 0.70}
  invoice_paid_terms_p: 0.10
  invoice_unpaid_terms_p: 0.55
  bank_recurring: ["SEPA Incasso algemeen doorlopend", "SEPA Incasso", "Incasso"]
  bank_oneoff: ["SEPA Overboeking", "Overboeking"]
  pos: ["BEA NR:%04d", "Betaalautomaat", "Pinbetaling"]
  ideal: ["iDEAL betaling", "iDEAL"]
  terminal_codes: ["Term %d", "POS %d", "Kassa %d", "Pas %03d", "Terminal %d"]
  btw_fragment_p: {invoice: 0.45, receipt_pos: 0.05, receipt_ideal: 0.08, bank: 0.0}
  reference_fragment_p: {invoice: 0.30, bank: 0.30}   # 'Kenmerk 4821907' style; shared business vocabulary, not class words
  # revision 2: bank lines of archetypes that do not send invoices (transit, fuel, parking, ride-hail,
  # supermarkets...) rarely carry a reference; factor applied to the bank probability above.
  reference_fragment_non_invoicing_factor: 0.15
  btw_note: "excl + rate% = total exactly; reverse charge (foreign SaaS) and 0% (KvK, intl flights) stated as such; every quoted amount is derived from the amount column"

date_model:
  tag: assumption
  business_days: "invoices and bank lines fall on business days (weekends only for receipts; NL public holidays ignored); recurring dates roll forward to the next business day"
  receipt_weekend_weights: {saturday: 0.55, sunday: 0.30}   # relative to a weekday = 1
  month_end_cluster:      # share of irregular INVOICES dated in the last 3 business days of a month (on top of the uniform baseline)
    "Professional Services Expense": 0.30
    "Utilities Expense": 0.0
    "Software & Subscriptions Expense": 0.0
  quarter_end: "accountant quarterly series are dated on the last business day of Mar/Jun/Sep/Dec"

# revision 2 (realism review round 2: frozen per-vendor price menus on ~20% of rows). Prices of a
# recurring contract now move. Every number here is a tunable assumption, not a measurement.
price_dynamics:
  tag: assumption
  annual_change_p: 0.60               # a contract's price changes at the turn of the year
  midyear_change_p_per_month: 0.015   # rare change at any other month
  change_range: [0.02, 0.09]          # relative increase
  seat_change_p_per_step: 0.07        # per-seat plans: one seat added (2/3) or removed (1/3) between two rows
  # Vendors whose selling entity is in these countries are treated as billing a USD list price that
  # is debited in EUR. Which real vendors bill NL customers in USD is NOT verified.
  usd_billed_countries: [US, CA, AU, PA]
  fx:                                 # synthetic EUR/USD random walk, one path for all seeds; not market data
    start: 1.05
    monthly_sigma: 0.015
    min: 0.98
    max: 1.22
    card_rate_jitter: 0.006
  extras:                             # per desc family: chance that a bill carries an extra on top of the base price
    telecom_mobile: {p: 0.35, range: [0.35, 22]}     # out-of-bundle usage
    telecom_both: {p: 0.25, range: [0.35, 22]}
    telecom_internet: {p: 0.08, range: [2, 30]}
    cowork: {p: 0.25, range: [5, 120]}               # meeting rooms, printing, day passes
    accounting: {p: 0.15, range: [2, 18]}            # extra administrations, bank links
    hosting: {p: 0.20, range: [0.5, 15]}             # domain renewals
    bike_sub: {p: 0.10, range: [5, 40]}
  vendor_price_points: >
    Archetype-level plan menus are placeholders shared by all vendors of the archetype; a vendor without
    its own menu gets a deterministic nearby price (+-20%, .00/.50/.95/.99 endings) so two vendors do
    not share one price list. Rent indexation (corpus index_p) raised 0.3 -> 0.7.
  fixed_price_archetypes: "corpus flag fixed_price (KvK fee): exempt from all of the above"

# revision 2 (realism review round 2: reference scaffolding). Which template may appear on which
# document, enforced in generate_transactions.allowed():
#  - 'Order/Bestelling <number>' only for webshop-style archetypes (doc mix has receipt_ideal >= 0.2,
#    or corpus flag orders) and only on invoices / iDEAL receipts;
#  - an invoice number never on a receipt, and on a bank line only if the archetype sends invoices
#    (doc mix invoice >= 0.35);
#  - bare 'Betaling/Payment <month>' never on a receipt;
#  - the NL/EN mix-in fragment (which quotes an invoice or payment reference) only on those same rows;
#  - a repeated (vendor, description) pair on a receipt is made distinct with date + time, not 'Factuur'.
description_formats:
  tag: "sourced (invoice fields, bank channels: belastingdienst.nl); templates and number formats assumption"
  url: https://www.belastingdienst.nl
  invoice_number_formats: ["2026-0142", "INV-2026-00123", "F2026/0087"]
  period_formats: ["Periode 01-08-2026 t/m 31-08-2026", "Q3 2026", "Aug 2026"]
  bank_channels: ["SEPA Incasso algemeen doorlopend", "SEPA Overboeking", "Betaalautomaat", "BEA NR:", "iDEAL"]
  keyword_free_fraction: 0.33  # descriptions with no class keyword (see shortcut band)

# Fraction of rows whose description contains an obvious class keyword ("toner", "huur",
# "abonnement", "parking"). Too high = trivial keyword classifier; too low = unrealistic.
keyword_shortcut_band:
  tag: assumption
  # revision 1 (documented trade-off): the description-token exclusivity gate (<= 30% of top-20 tokens
  # exclusive to one class) needs shared business vocabulary (factuur/invoice/betaling/order/periode/BTW/
  # SEPA) in every class. Measured on TEMPLATES with the checker's lexicon this moves the keyword-free
  # share from ~0.35 to ~0.60-0.75; the class signal moves to the vendor field and to the class nouns
  # that remain in ~1/3 of templates. Vendor tokens are excluded from the description-exclusivity gate.
  keyword_bearing_fraction: {min: 0.20, target: 0.35, max: 0.65}
  keyword_free_fraction: {min: 0.25, target: 0.60, max: 0.80}
  no_class_exclusive_vocabulary: true
  max_exclusive_tokens_in_top20_per_class: 0.30   # gate on DESCRIPTION tokens (vendor-name tokens removed); vendor tokens reported separately
  max_description_pattern_share_per_class: 0.03

noise_model:
  tag: assumption   # rates are tunable, not measured
  applied_per_row_independently: true
  # Realised-rate rule (revision 1): each op's per-row probability is rate x N / (#eligible rows) so
  # the REALISED share of all rows equals `rate` (an op that needs a substitutable word/a
  # terminal receipt is only drawn on eligible rows). The manifest reports realised vs spec.
  operations:
    - {name: typo_char_swap_drop_dup, rate: 0.06, note: "keyboard-adjacent substitution, dropped/doubled letter, adjacent swap"}
    - {name: abbreviation_nl_en, rate: 0.10, examples: ["fact.", "mnd", "abon.", "subscr."]}
    - {name: casing_variation, rate: 0.20, modes: {UPPER: 0.5, lower: 0.2, Title: 0.3}}
    - {name: nl_en_mix_in_one_row, rate: 0.12}
    - {name: ocr_confusion, rate: 0.05, pairs: ["O->0", "l->1", "I->1", "S->5", "B->8", "m->rn", "0->O (refs)", "1->l (refs)"]}
    - {name: truncated_description, rate: 0.08, keep_chars: [20, 40], widths: [27, 32, 35, 40]}
    - {name: store_terminal_code, rate: 0.05, note: "card-terminal receipts only; rate is over ALL rows"}
    - {name: vendor_legal_suffix_variation, rate: 0.15, note: "only the vendor's own Dutch form (B.V./BV, N.V./NV); never on consumer brands or foreign entities"}
    - {name: missing_or_generic_description, rate: 0.04}
  removed: "bank_prefix_suffix (0.30): replaced by the doc-type payment field (payment_text), whose realised shares are reported"
  max_ops_per_row: 3

difficulty_mix:
  tag: assumption
  clear: 0.88
  hard_ambiguous: 0.12      # per-row Bernoulli; band 0.10-0.15
  hard_ambiguous_band: [0.10, 0.15]
  hard_row_class_impact: >
    Hard rows are counted inside class_prior by their final label; easy-row class probabilities are
    the residual (prior x N - realised hard labels), sampled MULTINOMIALLY (no exact quotas).

hard_cases:
  tag: assumption   # except marketplace fact (sourced, bol.com)
  url: https://www.bol.com
  weights_sum_to_1: true
  # Escalate rules (revision 1):
  #  - vendor_description_disagree rows are ALWAYS escalate=true (label General/Other, true_account = the
  #    account the description implies).
  #  - generic_description rows escalate only when the vendor does NOT resolve the account
  #    (ambiguous brand vendors, share `ambiguous_vendor_share`); otherwise they keep the vendor's
  #    account with difficulty=hard.
  #  - brand cases: escalate is a per-kind flag below.
  cases:
    - id: bol_marketplace
      weight: 0.11
      kinds:
        office: {p: 0.50, account: "Office Supplies Expense", escalate: false}
        software: {p: 0.10, account: "Software & Subscriptions Expense", escalate: false}
        generic: {p: 0.40, account: "General/Other Expense", escalate: true}
    - id: amazon_nl
      weight: 0.10
      kinds:
        office: {p: 0.45, account: "Office Supplies Expense", escalate: false}
        software: {p: 0.15, account: "Software & Subscriptions Expense", escalate: false}
        generic: {p: 0.40, account: "General/Other Expense", escalate: true}
    - id: coolblue_action
      weight: 0.12
      kinds:
        office: {p: 0.50, account: "Office Supplies Expense", escalate: false}
        household_misc: {p: 0.20, account: "General/Other Expense", escalate: false}
        generic: {p: 0.30, account: "General/Other Expense", escalate: true}
    - id: albert_heijn_hema
      weight: 0.12
      kinds:
        groceries_private: {p: 0.40, account: "General/Other Expense", escalate: true}
        business_goods: {p: 0.35, account: "General/Other Expense", escalate: false}
        office_item: {p: 0.25, account: "Office Supplies Expense", escalate: false}
    - id: google_ads_vs_workspace
      weight: 0.07
      kinds:
        workspace: {p: 0.35, account: "Software & Subscriptions Expense", escalate: false}
        cloud: {p: 0.10, account: "Software & Subscriptions Expense", escalate: false}
        ads: {p: 0.55, account: "General/Other Expense", escalate: true}
    - id: fuel_station_shop
      weight: 0.08
      kinds:
        fuel: {p: 0.55, account: "Travel & Transport Expense", escalate: false}
        shop: {p: 0.45, account: "General/Other Expense", escalate: true}
    - id: generic_description
      weight: 0.16
      ambiguous_vendor_share: 0.30
    - id: vendor_description_disagree
      weight: 0.24
  # Headline = sum(weight x escalate share) / sum(weight); the generator recomputes it from the
  # table above (manifest: escalate_fraction_of_hard_from_case_weights) and a test asserts agreement.
  # 0.11*0.40 + 0.10*0.40 + 0.12*0.30 + 0.12*0.40 + 0.07*0.55 + 0.08*0.45 + 0.16*0.30 + 0.24*1.0
  overall_escalate_fraction_of_hard: 0.5305

splits:
  tag: assumption
  fractions: {train: 0.70, val: 0.15, test: 0.15}
  unit: vendor    # vendor-disjoint; random row splits forbidden
  stratify_by_class: true
  ambiguous_vendors_note: >
    Named ambiguous vendors (Bol.com, Amazon, Albert Heijn...) are few; assign whole vendors
    to splits so each split contains hard cases (test must have >=1 named ambiguous vendor per case where possible).
  tolerance: {row_fraction_abs: 0.03, class_min_rows_in_test: 30}

quality_gates:
  tag: assumption   # heuristic thresholds from CREW.md
  unique_after_normalization_min: 0.95
  dup_max: 0.02
  synthetic_in_domain_accuracy_max: 0.98
